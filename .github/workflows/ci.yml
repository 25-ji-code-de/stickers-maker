name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci || npm install
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
